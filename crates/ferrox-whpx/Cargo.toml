[package]
name = "ferrox-whpx"
description = "Windows backend: runs the guest CPU under the Windows Hypervisor Platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferrox-core = { path = "../ferrox-core" }
ferrox-cpu = { path = "../ferrox-cpu" }
ferrox-machine = { path = "../ferrox-machine" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Hypervisor", "Win32_System_LibraryLoader"] }
